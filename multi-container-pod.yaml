apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
  - name: nginx
    image: nginx
    ports:
    - containerPort: 80
  - name: redis
    image: redis
    ports:
    - containerPort: 6379
  - name: failing-container
    image: busybox
    command: ["/bin/sh", "-c", "exit 1"]  # This container will fail immediately 
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
  namespace: default
  labels: 
    app: nginx
spec:
  clusterIP: None
  selector: 
    app: nginx
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 5050
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-default
  namespace: default
  labels: 
    app: nginx
spec:
  type: ClusterIP
  selector: 
    app: nginx
  ports:
    - name: web
      protocol: TCP
      port: 80

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: default
spec:
  serviceName: "nginx-headless"
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
              name: web
        
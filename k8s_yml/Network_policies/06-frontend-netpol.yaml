---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: app1-ns
spec:
  podSelector:
    matchLabels:
      app: app1
      role: frontend                  # Targets frontend pods only
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0          # Allow from any IP (external client, e.g., localhost in KIND)
      ports:
        - protocol: TCP
          port: 80                   # Allow HTTP traffic on port 80
    - from:
        - podSelector:
            matchLabels:
              app: app1
              role: backend          # Allow traffic from backend pods
      ports:
        - protocol: TCP
          port: 80  
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: app1
              role: backend          # Allow access to backend pods
      ports:
        - protocol: TCP
          port: 5678
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns      # Allow DNS queries to CoreDNS pods in kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

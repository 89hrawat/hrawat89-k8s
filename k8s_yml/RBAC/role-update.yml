apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default     # Namespace where access is granted
  name: harendra-pod-crud-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  - apiGroups: ["apps"]   # Deployments are part of apps/v1
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]


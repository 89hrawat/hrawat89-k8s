apiVersion: v1
kind: Pod
metadata:
  name: pod1
  labels:
    tier: frontend
spec:
  containers:
  - name: hello1
    image: gcr.io/google-samples/hello-app:2.0
    resources: 
      limits:
        cpu: 300m
        memory: 400Mi
      requests:
        cpu: 150m
        memory: 200Mi

---

apiVersion: v1
kind: Pod
metadata:
  name: pod2
  labels:
    tier: frontend
spec:
  containers:
  - name: hello2
    image: gcr.io/google-samples/hello-app:1.0
    resources: 
      limits:
        cpu: 300m
        memory: 400Mi
      requests:
        cpu: 150m
        memory: 200Mi 

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-multiport-service
  namespace: default
  labels: 
    type: nginx-multiport
spec:
  type: NodePort
  selector: 
    app: nginx-multiport
  ports:
    - name: nignx-lb
      protocol: TCP
      port: 8080
      targetPort: 80
      nodePort: 30090
    - name: nginx-lb-tls
      protocol: TCP
      port: 8081
      targetPort: 443
      nodePort: 30088    


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-multiport
  labels:
    app: nginx-multiport
    env: test
  namespace: default
spec:
  minReadySeconds: 15
  replicas: 3
  revisionHistoryLimit: 10
  selector: 
    matchLabels:                                ## equality based operators  like == and !=,  other one set based operators like in, notin 
      app: nginx-multiport
  strategy: 
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template: 
    metadata:
      labels:
        app: nginx-multiport
        env: test
    spec:
      containers:
       - name: nginx
         image: nginx
         env: 
           - name: POD_IP
             valueFrom:
               fieldRef:
                 fieldPath: status.podIP
         command: ["/bin/sh", "-c"]
         args:
           - |
             echo "<html><body><h1>Pod IP: $POD_IP</h1></body></html>" > /usr/share/nginx/html/index.html && \
             nginx -g 'daemon off;'
                   
         imagePullPolicy: IfNotPresent
         ports:
           - containerPort: 80
             protocol: TCP
           - containerPort: 443  
         resources: 
           limits:
             cpu: 300m
             memory: 400Mi

      
---
apiVersion: apps/v1 
kind: DaemonSet
metadata:
  name: example-daemonset
  namespace: kube-system
  deletionGracePeriodSeconds: 30
  labels:
    app: log-collector
spec:
  minReadySeconds: 10
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
       
      labels:
        app: log-collector
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: fluentd-elasticsearch
          image: quay.io/fluentd_elasticsearch/fluentd:v5.0.1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 300m
              memory: 400Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers  
              mountPath: /var/lib/docker/containers
              readOnly: true
      nodeSelector:
            kubernetes.io/os: linux    
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pd
spec:
  containers:
    - image: busybox
      name: test-container
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - mountPath: /data
          name: cachevolume
    - name: test-container2
      image: busybox
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - mountPath: /data
          name: cachevolume
    - name: test-without-vol
      image: busybox
      command: ["/bin/sh", "-c", "sleep 3600"]      
  volumes:
    - name: cachevolume
      emptyDir:
        sizeLimit: 100Mi

